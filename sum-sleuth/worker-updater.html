<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sumflowers Worker Updater</title><style>body{max-width:760px;margin:2rem auto;padding:0 1rem;font:16px system-ui;color:#17352b}textarea{display:block;width:100%;min-height:9rem;margin-bottom:1rem}button{font:inherit;padding:.6rem}</style><main><h1>Sumflowers Worker Updater</h1><p>Copy the full current <strong>lategan-chatbot → Edit code → worker.js</strong> from Cloudflare into this box. Add the leaderboard, copy the result back into the editor and deploy.</p><label for="source">Current Worker code</label><textarea id="source" spellcheck="false"></textarea><button type="button" id="patch">Add leaderboard</button> <button type="button" id="copy" disabled>Copy updated code</button><p id="status" role="status"></p><textarea id="output" readonly hidden aria-label="Updated Worker code"></textarea></main><script>
const anchor="      return json({ error: \"Unknown action.\" }, 400);", route="      if (action === \"sumflowers_best\") return await handleSumflowersBest(env, body, json);", handler="async function handleSumflowersBest(env, body, json) {\n  if (!perthStudentAccessOpen()) return studentHoursClosedResponse(json);\n  const level = body.level;\n  if (!Number.isInteger(level) || level < 1 || level > 6) return json({error:\"Choose a Sumflowers level.\"},400);\n  const student = await getStudent(env, body.student_code);\n  if (!student) return json({error:\"Sign in to Student Hub to see Year 4 bests.\"},401);\n  const year4 = name => /^4[A-Z]$/i.test(String(name || \"\").trim());\n  const group = student.class_id == null ? null : await env.DB.prepare(\n    \"SELECT name,year_level,active FROM classes WHERE id=?\"\n  ).bind(student.class_id).first();\n  const eligible = group\n    ? group.active && (/^(?:year\\s*)?4$/i.test(String(group.year_level||\"\").trim()) || year4(group.name))\n    : student.class_id == null && year4(student.class_name);\n  if (!eligible) return json({error:\"Year 4 bests are open to Year 4 students.\"},403);\n\n  const timeMs = body.time_ms;\n  if (timeMs !== undefined && (!Number.isSafeInteger(timeMs) || timeMs <= 0 || timeMs > 86400000))\n    return json({error:\"Invalid finish time.\"},400);\n\n  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS sumflowers_bests (\n    student_id INTEGER NOT NULL, level INTEGER NOT NULL, time_ms INTEGER NOT NULL,\n    PRIMARY KEY(student_id, level)\n  )`).run();\n  if (timeMs !== undefined) {\n    await env.DB.prepare(`INSERT INTO sumflowers_bests(student_id,level,time_ms) VALUES(?,?,?)\n      ON CONFLICT(student_id,level) DO UPDATE SET time_ms=excluded.time_ms\n      WHERE excluded.time_ms < sumflowers_bests.time_ms`).bind(student.id,level,timeMs).run();\n  }\n  const mine = await env.DB.prepare(\"SELECT time_ms FROM sumflowers_bests WHERE student_id=? AND level=?\")\n    .bind(student.id,level).first();\n  const {results} = await env.DB.prepare(`\n    SELECT b.time_ms, s.display_name, COALESCE(c.name,s.class_name) AS class_name\n    FROM sumflowers_bests b JOIN students s ON s.id=b.student_id\n    LEFT JOIN classes c ON c.id=s.class_id\n    WHERE b.level=? AND s.active=1 AND (\n      (c.active=1 AND (lower(trim(c.year_level)) IN ('4','year 4','year4') OR upper(trim(c.name)) GLOB '4[A-Z]'))\n      OR (s.class_id IS NULL AND upper(trim(s.class_name)) GLOB '4[A-Z]')\n    )\n    ORDER BY b.time_ms, b.student_id LIMIT 5\n  `).bind(level).all();\n  return json({myBest:mine?.time_ms ?? null,year4Best:results.map(row=>({\n    name:String(row.display_name||\"Student\").trim().split(/\\s+/)[0]||\"Student\",\n    className:row.class_name, timeMs:row.time_ms\n  }))});\n}\n";
function patchWorker(source) {
  if(source.includes("async function handleSumflowersBest("))return source;
  if(source.split(anchor).length!==2||!source.includes("async function getStudent("))throw Error("Paste the full current Learning Hub worker.js.");
  return source.replace(anchor,()=>route+"\n"+anchor)+"\n"+handler;
}
const $=id=>document.getElementById(id);
$('patch').onclick=()=>{
 try{
  const source=$('source').value,result=patchWorker(source);
  $('output').value=result;$('output').hidden=false;$('copy').disabled=false;
  $('status').textContent=result===source?'Leaderboard already present.':'Updated code ready.';
 }catch(error){$('output').value='';$('output').hidden=true;$('copy').disabled=true;$('status').textContent=error.message}
};
$('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Updated code copied.'}
 catch{$('output').focus();$('output').select();$('status').textContent='Press Ctrl+C or Command+C to copy.'}
};
</script></html>
