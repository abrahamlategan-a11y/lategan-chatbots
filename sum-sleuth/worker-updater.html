const anchor="      return json({ error: \"Unknown action.\" }, 400);", oldRoute="if (action === \"sumflowers_best\") return await handleSumflowersBest(env, body, json);", route="      if (action === \"sumflowers_best\") return await handleSumflowersBestsWithTeachers(env, body, json);", handler="async function handleSumflowersBestsWithTeachers(env, body, json) {\n  const teacher = body.teacher_code ? await getTeacher(env, body.teacher_code) : null;\n  if (body.teacher_code && !teacher) return json({error:\"Sign in to Teacher Hub to see best times.\"},401);\n  if (!teacher && !perthStudentAccessOpen()) return studentHoursClosedResponse(json);\n  const level = body.level;\n  if (!Number.isInteger(level) || level < 1 || level > 6) return json({error:\"Choose a Sumflowers level.\"},400);\n  const student = teacher ? null : await getStudent(env, body.student_code);\n  if (!teacher && !student) return json({error:\"Sign in to Student Hub to see Year 4 bests.\"},401);\n  const year4 = name => /^4[A-Z]$/i.test(String(name || \"\").trim());\n  const group = student?.class_id == null ? null : await env.DB.prepare(\n    \"SELECT name,year_level,active FROM classes WHERE id=?\"\n  ).bind(student.class_id).first();\n  const eligible = teacher || (group\n    ? group.active && (/^(?:year\\s*)?4$/i.test(String(group.year_level||\"\").trim()) || year4(group.name))\n    : student?.class_id == null && year4(student?.class_name));\n  if (!eligible) return json({error:\"Year 4 bests are open to Year 4 students.\"},403);\n\n  const timeMs = body.time_ms;\n  if (timeMs !== undefined && (!Number.isSafeInteger(timeMs) || timeMs <= 0 || timeMs > 86400000))\n    return json({error:\"Invalid finish time.\"},400);\n\n  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS sumflowers_bests (\n    student_id INTEGER NOT NULL, level INTEGER NOT NULL, time_ms INTEGER NOT NULL,\n    PRIMARY KEY(student_id, level)\n  )`).run();\n  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS sumflowers_teacher_bests (\n    teacher_id INTEGER NOT NULL, level INTEGER NOT NULL, time_ms INTEGER NOT NULL,\n    PRIMARY KEY(teacher_id, level)\n  )`).run();\n  const table = teacher ? 'sumflowers_teacher_bests' : 'sumflowers_bests';\n  const idColumn = teacher ? 'teacher_id' : 'student_id';\n  const playerId = (teacher || student).id;\n  if (timeMs !== undefined) {\n    await env.DB.prepare(`INSERT INTO ${table}(${idColumn},level,time_ms) VALUES(?,?,?)\n      ON CONFLICT(${idColumn},level) DO UPDATE SET time_ms=excluded.time_ms\n      WHERE excluded.time_ms < ${table}.time_ms`).bind(playerId,level,timeMs).run();\n  }\n  const mine = await env.DB.prepare(`SELECT time_ms FROM ${table} WHERE ${idColumn}=? AND level=?`)\n    .bind(playerId,level).first();\n  const {results} = await env.DB.prepare(`\n    SELECT b.time_ms, s.display_name, COALESCE(c.name,s.class_name) AS class_name\n    FROM sumflowers_bests b JOIN students s ON s.id=b.student_id\n    LEFT JOIN classes c ON c.id=s.class_id\n    WHERE b.level=? AND s.active=1 AND (\n      (c.active=1 AND (lower(trim(c.year_level)) IN ('4','year 4','year4') OR upper(trim(c.name)) GLOB '4[A-Z]'))\n      OR (s.class_id IS NULL AND upper(trim(s.class_name)) GLOB '4[A-Z]')\n    )\n    ORDER BY b.time_ms, b.student_id LIMIT 5\n  `).bind(level).all();\n  const {results:teachers} = await env.DB.prepare(`\n    SELECT b.time_ms,t.display_name FROM sumflowers_teacher_bests b\n    JOIN teachers t ON t.id=b.teacher_id WHERE b.level=? AND t.active=1\n    ORDER BY b.time_ms,b.teacher_id LIMIT 5\n  `).bind(level).all();\n  const teacherBest = teachers.map(row=>({name:row.display_name||\"Teacher\",timeMs:row.time_ms}));\n  return json({myBest:mine?.time_ms ?? null,teacherBest,year4Best:results.map(row=>({\n    name:String(row.display_name||\"Student\").trim().split(/\\s+/)[0]||\"Student\",\n    className:row.class_name, timeMs:row.time_ms\n  }))});\n}\n";

const gameBestHandler="async function handleGuavagramsBests(env, body, json) {\n  const teacher = body.teacher_code ? await getTeacher(env, body.teacher_code) : null;\n  if (body.teacher_code && !teacher) return json({error:\"Sign in to Teacher Hub to see records.\"},401);\n  if (!teacher && !perthStudentAccessOpen()) return studentHoursClosedResponse(json);\n  const student = teacher ? null : await getStudent(env, body.student_code);\n  if (!teacher && !student) return json({error:\"Sign in to Student Hub to see records.\"},401);\n  const year4Class = `((c.active=1 AND (replace(lower(trim(c.year_level)),' ','') IN ('4','year4')\n    OR upper(trim(c.name)) GLOB '4[A-Z]')) OR\n    (s.class_id IS NULL AND upper(trim(s.class_name)) GLOB '4[A-Z]'))`;\n  if (student && !await env.DB.prepare(`SELECT s.id FROM students s LEFT JOIN classes c ON c.id=s.class_id\n    WHERE s.id=? AND s.active=1 AND ${year4Class}`).bind(student.id).first()) {\n    return json({error:\"Year 4 records are open to Year 4 students.\"},403);\n  }\n  const mode = body.record_mode;\n  const count = mode === \"free\" || mode === \"streak\";\n  const multiplayer = mode === \"roomEasy\" || mode === \"roomHard\";\n  if (![ \"free\",\"streak\",\"easy\",\"medium\",\"hard\",\"sprint15\",\"sprint21\",\"sprint30\",\"roomEasy\",\"roomHard\" ].includes(mode)) {\n    return json({error:\"Choose a Guavagrams mode.\"},400);\n  }\n  const score = body.score;\n  if (score !== undefined && (multiplayer || !Number.isSafeInteger(score) || score < 1 ||\n      score > (mode === \"free\" ? 288 : mode === \"streak\" ? 144 : 86400))) {\n    return json({error:\"Invalid Guavagrams result.\"},400);\n  }\n\n  await ensureGuavagramsBests(env);\n  const role = teacher ? \"teacher\" : \"student\";\n  const playerId = (teacher || student).id;\n  if (score !== undefined) {\n    const better = count ? \">\" : \"<\";\n    await env.DB.prepare(`INSERT INTO guavagrams_bests(role, player_id, mode, score) VALUES(?,?,?,?)\n      ON CONFLICT(role,player_id,mode) DO UPDATE SET score=excluded.score\n      WHERE excluded.score ${better} guavagrams_bests.score`).bind(role,playerId,mode,score).run();\n  }\n  const mine = await env.DB.prepare(\"SELECT score FROM guavagrams_bests WHERE role=? AND player_id=? AND mode=?\")\n    .bind(role,playerId,mode).first();\n  const order = count ? \"DESC\" : \"ASC\";\n  const {results} = await env.DB.prepare(`SELECT b.score,s.display_name,COALESCE(c.name,s.class_name) AS class_name\n    FROM guavagrams_bests b JOIN students s ON s.id=b.player_id\n    LEFT JOIN classes c ON c.id=s.class_id\n    WHERE b.mode=? AND b.role='student' AND s.active=1 AND ${year4Class}\n    ORDER BY b.score ${order},s.id LIMIT 5`).bind(mode).all();\n  const {results:teachers} = await env.DB.prepare(`SELECT b.score,t.display_name\n    FROM guavagrams_bests b JOIN teachers t ON t.id=b.player_id\n    WHERE b.mode=? AND b.role='teacher' AND t.active=1\n    ORDER BY b.score ${order},t.id LIMIT 5`).bind(mode).all();\n  return json({\n    myBest:mine?.score ?? null,\n    year4Best:results.map(row=>({\n      name:String(row.display_name||\"Student\").trim().split(/\\s+/)[0]||\"Student\",\n      className:row.class_name, score:row.score\n    })),\n    teacherBest:teachers.map(row=>({name:row.display_name||\"Teacher\",score:row.score}))\n  });\n}\n\nasync function ensureGuavagramsBests(env) {\n  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS guavagrams_bests (\n    role TEXT NOT NULL, player_id INTEGER NOT NULL, mode TEXT NOT NULL, score INTEGER NOT NULL,\n    PRIMARY KEY(role,player_id,mode)\n  )`).run();\n}\n";
const legacyRoom="async function guavaRoomRequest(env, body, json) {\n  const fail = (message, status = 400) => json({error: message}, status);\n  if (!perthStudentAccessOpen()) return studentHoursClosedResponse(json);\n  const student = await getStudent(env, body.student_code);\n  if (!student) return fail(\"Enter your Learning Hub student code.\", 401);\n  const studentId = String(student.id);\n  const action = body.action.slice(6);\n  const db = (sql, ...values) => {\n    const statement = env.DB.prepare(sql);\n    return values.length ? statement.bind(...values) : statement;\n  };\n  await db(\"CREATE TABLE IF NOT EXISTS guava_rooms (code TEXT PRIMARY KEY, revision INTEGER NOT NULL DEFAULT 0, state TEXT NOT NULL, expires INTEGER NOT NULL)\").run();\n  const time = Date.now();\n  const expiry = time + 12 * 60 * 60 * 1000;\n  const makePlayer = () => ({name: student.display_name, tiles: [], pending: [], swap: null, reset: 0});\n  const view = (code, room, revision) => {\n    const player = room.players[studentId];\n    return json({code, revision, phase: room.phase, mode: room.mode, host: room.host === studentId,\n      players: Object.values(room.players).map(p => p.name), winner: room.winner,\n      started: room.started, tiles: player.tiles, pending: player.pending.length,\n      reset: player.reset, invalid: player.invalid || [], pool: room.pool.length,\n      available: room.pool.length - Object.values(room.players).reduce((total, p) => total + (p.swap || 0), 0),\n      swap: player.swap ? {remaining: player.swap, slots: room.pool.map(t => t.id)} : null});\n  };\n  if (action === \"create\") {\n    await db(\"DELETE FROM guava_rooms WHERE expires<=?\", time).run();\n    const room = {phase: \"waiting\", host: studentId, mode: body.mode === \"hard\" ? \"hard\" : \"easy\",\n      players: {[studentId]: makePlayer()}, pool: []};\n    const alphabet = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n    for (let attempt = 0; attempt < 5; attempt++) {\n      const code = Array.from(crypto.getRandomValues(new Uint8Array(6)), n => alphabet[n % alphabet.length]).join(\"\");\n      const inserted = await db(\"INSERT OR IGNORE INTO guava_rooms(code,state,expires) VALUES(?,?,?) RETURNING revision\", code, JSON.stringify(room), expiry).first();\n      if (inserted) return view(code, room, inserted.revision);\n    }\n    return fail(\"Could not make a room. Try again.\", 503);\n  }\n  const code = String(body.code || \"\").trim().toUpperCase();\n  if (!/^[A-Z2-9]{6}$/.test(code)) return fail(\"Enter the six-character room code.\");\n  for (let attempt = 0; attempt < 8; attempt++) {\n    const row = await db(\"SELECT revision,state FROM guava_rooms WHERE code=? AND expires>?\", code, time).first();\n    if (!row) return fail(\"That room code has expired or doesn’t exist.\", 404);\n    const room = JSON.parse(row.state);\n    const player = room.players[studentId];\n    const players = Object.values(room.players);\n    const available = room.pool.length - players.reduce((total, p) => total + (p.swap || 0), 0);\n    if (action === \"join\" && !player) {\n      if (room.phase !== \"waiting\") return fail(\"This game has already started.\", 409);\n      if (players.length >= 8) return fail(\"This room is full.\", 409);\n      room.players[studentId] = makePlayer();\n    } else {\n      if (!player) return fail(\"Join this room first.\", 403);\n      if (action === \"state\" || action === \"join\") return view(code, room, row.revision);\n      if (action === \"leave\" && room.phase === \"waiting\") {\n        delete room.players[studentId];\n        if (room.host === studentId) {\n          room.host = Object.keys(room.players)[0];\n          if (!room.host) room.phase = \"closed\";\n        }\n      } else if (action === \"start\") {\n        if (room.host !== studentId || room.phase !== \"waiting\") return fail(\"Only the host can start the waiting room.\", 409);\n        if (players.length < 2) return fail(\"Wait for at least one friend to join.\", 409);\n        const counts = {A:13,B:3,C:3,D:6,E:18,F:3,G:4,H:3,I:12,J:2,K:2,L:5,M:3,N:8,O:11,P:3,Q:2,R:9,S:6,T:9,U:6,V:2,W:3,X:2,Y:3,Z:2};\n        room.pool = Object.entries(counts).flatMap(([letter,count]) => Array.from({length:count}, () => ({id:crypto.randomUUID(),letter})));\n        room.pool = guavaShuffle(room.pool);\n        const starting = players.length <= 4 ? 15 : players.length <= 6 ? 12 : 10;\n        for (const member of players) member.tiles = room.pool.splice(0,starting);\n        room.phase = \"playing\";\n        room.started = time;\n      } else {\n        if (room.phase !== \"playing\") return fail(\"The room isn’t playing right now.\", 409);\n        if (action === \"swap\") {\n          if (player.swap || player.pending.length || available < 3) return fail(\"You need three available stash tiles to swap.\", 409);\n          const index = player.tiles.findIndex(t => t.id === body.tile);\n          if (index < 0) return fail(\"Pick one of your own tiles.\");\n          player.returned = player.tiles.splice(index,1)[0];\n          player.swap = 3;\n        } else if (action === \"flip\") {\n          if (player.swap) {\n            const index = room.pool.findIndex(t => t.id === body.tile);\n            if (index < 0) return fail(\"Someone took that tile. Try another.\", 409);\n            player.tiles.push(room.pool.splice(index,1)[0]);\n            if (--player.swap === 0) {\n              room.pool.splice(crypto.getRandomValues(new Uint16Array(1))[0] % (room.pool.length + 1),0,player.returned);\n              delete player.returned;\n            }\n          } else {\n            if (!player.pending.length) return fail(\"There’s no tile to flip.\", 409);\n            player.tiles.push(player.pending.shift());\n          }\n        } else if (action === \"pick\" || action === \"claim\") {\n          if (player.swap || player.pending.length) return fail(\"Finish picking your tiles first.\", 409);\n          if (action === \"pick\" ? available < players.length : room.pool.length >= players.length || players.some(p => p.swap)) {\n            return fail(action === \"pick\" ? \"There aren’t enough tiles for everyone to pick.\" : \"The stash still has tiles to draw or a swap is in progress.\", 409);\n          }\n          const words = guavaBoardWords(player.tiles, body.board);\n          if (!words) return fail(\"Put all your tiles into one connected board first.\", 409);\n          if (room.mode === \"easy\" || action === \"claim\") {\n            const dictionary = await guavaRoomDictionary().catch(() => null);\n            if (!dictionary) return fail(\"The dictionary is temporarily unavailable. Try again.\", 503);\n            const invalid = words.filter(word => !dictionary.has(word));\n            if (invalid.length) {\n              if (room.mode === \"easy\") return fail(\"Check these words: \" + invalid.join(\", \").toUpperCase(), 409);\n              player.invalid = invalid;\n              player.reset++;\n            } else if (action === \"claim\") {\n              room.phase = \"finished\";\n              room.winner = player.name;\n            }\n          }\n          if (action === \"pick\") for (const member of players) member.pending.push(room.pool.pop());\n        } else return fail(\"Unknown room action.\", 404);\n      }\n    }\n    const updated = await db(\"UPDATE guava_rooms SET state=?,revision=revision+1 WHERE code=? AND revision=? RETURNING revision\", JSON.stringify(room), code, row.revision).first();\n    if (updated) return action === \"leave\" ? json({phase:\"left\"}) : view(code, room, updated.revision);\n  }\n  return fail(\"The room is busy. Try again.\", 409);\n}\nfunction guavaShuffle(tiles) {\n  const random = crypto.getRandomValues(new Uint32Array(tiles.length));\n  for (let i = tiles.length - 1; i > 0; i--) {\n    const j = random[i] % (i+1);\n    [tiles[i],tiles[j]] = [tiles[j],tiles[i]];\n  }\n  return tiles;\n}\nfunction guavaBoardWords(tiles, board) {\n  if (!Array.isArray(board) || board.length !== tiles.length || tiles.length < 2) return null;\n  const inventory = new Map(tiles.map(t => [t.id,t.letter]));\n  const cells = new Map();\n  for (const cell of board) {\n    if (!cell || !inventory.has(cell.id) || !Number.isInteger(cell.x) || !Number.isInteger(cell.y) ||\n      Math.abs(cell.x) > 10000 || Math.abs(cell.y) > 10000 || cells.has(cell.x+','+cell.y)) return null;\n    cells.set(cell.x+','+cell.y,{x:cell.x,y:cell.y,letter:inventory.get(cell.id)});\n    inventory.delete(cell.id);\n  }\n  const queue = [board[0]], seen = new Set([board[0].x+','+board[0].y]);\n  for (const {x,y} of queue) for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {\n    const key = (x+dx)+','+(y+dy);\n    if (cells.has(key) && !seen.has(key)) { seen.add(key); queue.push(cells.get(key)); }\n  }\n  if (seen.size !== tiles.length) return null;\n  const words = new Set();\n  for (const {x,y} of cells.values()) for (const [dx,dy] of [[1,0],[0,1]]) {\n    if (cells.has((x-dx)+','+(y-dy))) continue;\n    let word = '';\n    for (let a=x,b=y; cells.has(a+','+b); a+=dx,b+=dy) word += cells.get(a+','+b).letter;\n    if (word.length >= 2) words.add(word.toLowerCase());\n  }\n  return [...words];\n}\nlet guavaDictionaryPromise;\nfunction guavaRoomDictionary() {\n  guavaDictionaryPromise ??= loadGuavaRoomDictionary().catch(error => {\n    guavaDictionaryPromise = null;\n    throw error;\n  });\n  return guavaDictionaryPromise;\n}\nasync function loadGuavaRoomDictionary(){\nconst dictionarySource='https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/en/';\nconst dictionary=new Set(('lefty leftie lefties walking walked jumping jumped played playing colour colours coloured colouring favourite favourites organise organised organises organising koala koalas caring daring beg rips a i an as at am be by do go he hi if in is it me my no of oh on or ox so to up us we ace act add age ago aid aim air all and ant any a const nextUpdate="    if (action === \"claim\" && room.phase === \"finished\") {\n      room.recordedWinner = studentId;\n      room.recordedAt = time;\n    }\n    const nextState = JSON.stringify(room);\n    const update = db(\"UPDATE guava_rooms SET state=?,revision=revision+1 WHERE code=? AND revision=? RETURNING revision\", nextState, code, row.revision);\n    let updated;\n    if (action === \"claim\" && room.phase === \"finished\") {\n      await ensureGuavagramsBests(env);\n      const mode = room.mode === \"hard\" ? \"roomHard\" : \"roomEasy\";\n      const seconds = Math.max(1, Math.ceil((time - room.started) / 1000));\n      const record = db(`INSERT INTO guavagrams_bests(role,player_id,mode,score)\n        SELECT 'student',?,?,? FROM guava_rooms WHERE code=? AND revision=? AND state=?\n        ON CONFLICT(role,player_id,mode) DO UPDATE SET score=excluded.score\n        WHERE excluded.score < guavagrams_bests.score`, student.id, mode, seconds, code, row.revision + 1, nextState);\n      const [result] = await env.DB.batch([update, record]);\n      updated = result.results[0];\n    } else {\n      updated = await update.first();\n    }";
const recordsRoute="      if (action === \"guavagrams_best\") return await handleGuavagramsBests(env, body, json);";
function patchWorker(source) {
  let updated=patchSumflowers(source);
  const hasRecords=updated.includes("async function handleGuavagramsBests(");
  if (hasRecords && updated.includes("room.recordedWinner = studentId;") && updated.includes(recordsRoute.trim())) return updated;
  if (!updated.includes("async function guavaRoomRequest(")) {
    updated=updated.replace(anchor,()=>legacyDispatch+"\n"+anchor)+"\n"+legacyRoom;
  }
  const lastUpdate=updated.indexOf(updatePattern,updated.indexOf("async function guavaRoomRequest("));
  if (lastUpdate<0 || hasRecords) throw Error("Could not match the multiplayer Worker. Check that you copied the active worker.js.");
  updated=updated.slice(0,lastUpdate)+nextUpdate+updated.slice(lastUpdate+updatePattern.length);
  // Keep the records action ahead of the unknown-action response.
  return updated.replace(anchor,()=>recordsRoute+"\n"+anchor)+"\n"+gameBestHandler;
}
const $=id=>document.getElementById(id);
$('patch').onclick=()=>{
 try{
  const source=$('source').value,result=patchWorker(source);
  $('output').value=result;$('output').hidden=false;$('copy').disabled=false;
  $('status').textContent=result===source?'Game records already present.':'Updated code ready.';
 }catch(error){$('output').value='';$('output').hidden=true;$('copy').disabled=true;$('status').textContent=error.message}
};
$('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Updated code copied.'}
 catch{$('output').focus();$('output').select();$('status').textContent='Press Ctrl+C or Command+C to copy.'}
};
</script></html>
