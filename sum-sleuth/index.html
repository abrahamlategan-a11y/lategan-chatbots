<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumflowers · Learning Hub</title>
<style>
:root{font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;color:#121d4b;background:#fffefa;--mint:#c5f3e3}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0}main{max-width:960px;margin:auto;padding:clamp(8px,3vw,24px)}
a{color:#164f3e}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #23684f;outline-offset:3px}
button:disabled{cursor:default}h1,h2,p{margin:.4em 0}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.clock{display:flex;align-items:center;gap:.5rem;font-variant-numeric:tabular-nums}
.clock button,.action{min-height:56px;border:1px solid #bddbd0;border-radius:.85rem;padding:.5rem .9rem;background:#effaf5;font-weight:750}
.action.primary{background:var(--mint)}.setup{margin:2rem auto;max-width:480px;padding:1.5rem;border:1px solid #ede9f3;border-radius:24px;background:#fff;box-shadow:0 8px 25px #2d316619}
.setup fieldset{margin:1rem 0;padding:0;border:0}.setup label{display:block;margin:.6rem 0}
.setup select,.setup input[type=text]{width:100%;min-height:56px;border:1px solid #bddbd0;border-radius:12px;padding:.5rem;background:#fff}
.instruction{text-align:center;margin:.25rem 0 .65rem;min-height:1.4em}
.flower{display:grid;justify-content:center;align-items:center;gap:8px;grid-template-columns:repeat(3,minmax(181px,222px));grid-template-areas:". north ." "west centre east" ". south ."}
.petal,.centre{position:relative;min-width:0;display:grid;place-content:center;justify-items:center;gap:4px;padding:10px;border:1px solid var(--border);background:var(--petal);min-height:145px}
.petal{border-radius:54% 47% 52% 44% / 48% 59% 44% 58%}
.petal[data-position="0"]{grid-area:north;--petal:#e4f5ec;--border:#aadbc2}
.petal[data-position="1"]{grid-area:east;--petal:#ffefcf;--border:#e9ca89}
.petal[data-position="2"]{grid-area:south;--petal:#f3e8fa;--border:#d9bde8}
.petal[data-position="3"]{grid-area:west;--petal:#e4f2ff;--border:#b5d7ee}
.petal.done{background:color-mix(in srgb,var(--petal),white 68%);transition:background .3s}
.centre{grid-area:centre;--petal:#f2f2f5;--border:#d8dbe3;aspect-ratio:1;border-radius:50%;width:min(100%,195px);justify-self:center}
.centre.ready{--petal:#fff0de;--border:#edc48e}
.petal h2,.centre h2{font-size:.9rem;margin:0}.numbers{display:flex;max-width:180px;flex-wrap:wrap;justify-content:center;gap:4px}
.centre .numbers{display:grid;grid-template-columns:repeat(2,56px)}
.number{display:grid;place-items:center;width:56px;height:56px;padding:0;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:1.22rem;font-weight:850;box-shadow:0 2px 0 var(--border);touch-action:manipulation}
.number[aria-disabled=true]{cursor:default}.number.empty{background:#eceef2;box-shadow:none}.number.correct{background:#d0f4de;color:#10462f;box-shadow:0 0 14px #59bc7c80}
.petal.done .number:not(.correct){color:#5a6479;background:#ffffff90;box-shadow:none}
.number.wrong{background:#ffd9d8;color:#8b242a;animation:shake .28s}
@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
dialog{width:min(390px,calc(100% - 28px));padding:1.5rem;border:1px solid #b9dacd;border-radius:24px;text-align:center;color:inherit}dialog::backdrop{background:#17255455}
.resultTime{font-size:2rem;font-weight:900}.confetti{position:fixed;z-index:2;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:590px){
 .flower{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"north east" "centre centre" "west south";gap:5px}
 .petal,.centre{padding:7px}.centre{width:156px}.petal{border-radius:24px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.number[aria-pressed=true]:not(.correct){background:#dce5fa;color:#172554;border-color:#586caa;box-shadow:inset 0 0 0 1px #586caa}
.bests{text-align:left;background:#effaf5;border-radius:12px;margin:.75rem 0;padding:.55rem .85rem}.bests h3{margin:.35rem 0}.bests ol{padding-left:1.4rem;margin:.45rem 0}.bests li{padding:.18rem 0;font-variant-numeric:tabular-nums}.bests p:empty{display:none}
</style></head><body><main>
<header><a id="hubLink" href="../student/">← Student Hub</a><h1>Sumflowers</h1>
<div class="clock" id="clock" hidden><span id="time">0:00</span><button id="toggleTime" type="button" aria-controls="time" aria-expanded="true">Hide timer</button></div></header>
<form class="setup" id="setup">
<h2>Choose a puzzle</h2>
<label for="level">Choose an operation and difficulty</label>
<select id="level">
 <optgroup label="Addition">
  <option value="1">Addition · Easy (up to 20)</option>
  <option value="2">Addition · Medium (up to 100)</option>
  <option value="3">Addition · Hard (up to 250)</option>
 </optgroup>
 <optgroup label="Multiplication">
  <option value="4">Multiplication · Easy (×2, ×5 or ×10)</option>
  <option value="5">Multiplication · Medium (×3, ×4 and selected ×6 facts)</option>
  <option value="6">Multiplication · Hard (trickier facts, including factors above 12)</option>
 </optgroup>
</select>
<button class="action primary" type="submit">Start puzzle</button>
<button class="action" id="showBests" type="button">Best times</button>
<section class="bests" id="setupBests" aria-label="Best times for this level" hidden></section>
</form>
<section id="play" hidden aria-label="Flower puzzle"><p class="instruction" id="instruction"></p><div class="flower" id="flower"></div><p class="sr" id="announce" role="status"></p></section>
</main>
<dialog id="result" aria-labelledby="resultTitle"><h2 id="resultTitle">Puzzle solved!</h2><p class="resultTime" id="resultTime"></p><section class="bests" id="resultBests" aria-label="Best times for this level" hidden></section><button class="action primary" id="again" type="button">Play again</button></dialog>
<script type="module" src="./game.mjs?v=teacher-bests"></script></body></html>
