<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Hub · Student Assessment Pilot</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f3f7f5;color:#193c33;margin:0}header{background:#24654f;color:#fff;padding:20px}main{max-width:780px;margin:20px auto;padding:0 15px}.card{background:white;border:1px solid #d9e7df;border-radius:18px;padding:22px;margin:15px 0}h1{font-size:24px}label{display:block;font-weight:700;margin:12px 0}input:not([type=radio]),textarea{width:100%;padding:12px;border:1px solid #cadbd2;border-radius:10px;font:inherit}textarea{min-height:110px}button{padding:13px 18px;border:0;border-radius:11px;background:#24654f;color:white;font-weight:700;cursor:pointer}.note{background:#fff0cd;border-radius:12px;padding:12px;color:#644b1c}.muted{color:#64746b;font-size:14px}.option{font-weight:400;display:flex;gap:10px;align-items:center}.option input{width:auto}button:disabled{opacity:.5}</style></head><body><header>🏫 Student Hub · Assessment Pilot</header><main><h1 id="title">Loading assessment...</h1><p class="note">Pilot only: your answers save on this device. They are <strong>not automatically sent to your teacher</strong>. Download your response file and give it to your teacher as instructed.</p><div class="card"><label>Your student code<input id="code" placeholder="Enter your Learning Hub student code" autocomplete="off"></label><button id="verify">Verify student</button><p id="who" class="muted"></p></div><div id="questions"></div><div class="card"><button id="download" disabled>Download my completed responses</button><p id="status" class="muted"></p></div></main><script>
const API='https://lategan-chatbot.abrahamlategan.workers.dev', $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let test,student=null;
try{test=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));if(!test||!Array.isArray(test.questions)||!test.id)throw Error('Invalid test');$('title').textContent=test.title||'Assessment'}catch(e){$('title').textContent='Invalid assessment link';$('status').textContent='Ask your teacher for a new link.'}
const draftKey='lh-pilot-draft-'+(test?.id||'');
function draft(){try{return JSON.parse(localStorage.getItem(draftKey))||{}}catch{return {}}}
function save(){if(!test)return;const a={};test.questions.forEach(q=>{a[q.id]=q.type==='mcq'?(document.querySelector('input[name="q-'+q.id+'"]:checked')?.value??''):(document.querySelector('[data-answer="'+q.id+'"]')?.value??'')});localStorage.setItem(draftKey,JSON.stringify(a));$('status').textContent='Answers saved on this device.'}
if(test){const d=draft();$('questions').innerHTML=test.questions.map((q,i)=>'<div class="card"><h2>Question '+(i+1)+' <small class="muted">('+Number(q.marks||1)+' marks)</small></h2><p>'+esc(q.text)+'</p>'+(q.type==='mcq'?(q.options||[]).map((o,j)=>'<label class="option"><input type="radio" name="q-'+esc(q.id)+'" value="'+j+'" '+(String(d[q.id])===String(j)?'checked':'')+'>'+esc(o)+'</label>').join(''):'<textarea data-answer="'+esc(q.id)+'" placeholder="Type your response...">'+esc(d[q.id]||'')+'</textarea>')+'</div>').join('');$('questions').addEventListener('input',save);$('questions').addEventListener('change',save)}
$('verify').onclick=async()=>{const code=$('code').value.trim();if(!code)return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'student_login',student_code:code})});const d=await r.json();if(!r.ok||!d.student)throw Error(d.error||'Code not recognised');student=d.student;$('who').textContent='Verified: '+student.display_name+' · '+(student.class_name||'');$('download').disabled=false}catch(e){student=null;$('download').disabled=true;$('who').textContent=e.message}};
$('download').onclick=()=>{if(!student||!test)return;save();const payload={format:'learning-hub-assessment-response-v1',assessment_id:test.id,assessment_title:test.title,student_id:student.id,student_name:student.display_name,class_name:student.class_name,submitted_at:new Date().toISOString(),answers:draft()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='assessment-'+String(test.title||'test').replace(/[^a-z0-9]+/gi,'-')+'-'+String(student.display_name||'student').replace(/[^a-z0-9]+/gi,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Response file downloaded. Please give it to your teacher.'};
</script></body></html>
