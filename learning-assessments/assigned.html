<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My assessments · Student Hub</title>
<style>
:root{font-family:system-ui,sans-serif;background:#f3f7f5;color:#1c3840}
*{box-sizing:border-box}body{margin:0}header{padding:16px max(16px,calc((100% - 850px)/2));background:#205846}
header a{color:white}main{max-width:880px;margin:20px auto;padding:0 16px}
section,form#studentLogin{background:white;border:1px solid #dce7e2;border-radius:16px;padding:20px;margin:16px 0}
button,input,textarea{font:inherit}button{padding:10px 15px;border:1px solid #c9d9d1;border-radius:8px;background:white;color:inherit;cursor:pointer}
button:disabled{opacity:.65;cursor:default}button.primary{background:#205846;color:white;border-color:#205846}
textarea{width:100%;min-height:100px;padding:10px;border:1px solid #c9d9d1;border-radius:8px}
fieldset{border:1px solid #dce7e2;border-radius:12px;margin:0 0 16px;padding:12px 16px;min-width:0}
legend{font-weight:650;overflow-wrap:anywhere}label.option{display:block;margin:8px 0;padding:5px}
.card{border-bottom:1px solid #dce7e2;padding:12px 0}.card:last-child{border:0}.card h3{margin:0}
p{overflow-wrap:anywhere}.instructions{white-space:pre-wrap}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header><a href="../student/">⌂ Student Hub</a></header>
<main>
<h1>My assessments</h1>
<form id="studentLogin" hidden>
  <label>Student code <input id="code" required autocomplete="off" autocapitalize="characters"></label>
  <button class="primary">Open my assessments</button>
</form>
<p id="listStatus" role="status"></p>
<section id="list" hidden><div id="assignments"></div></section>
<section id="attempt" hidden>
  <button id="back" type="button">← My assessments</button>
  <h2 id="title"></h2><p id="instructions" class="instructions"></p>
  <form id="answers">
    <div id="questions"></div>
    <div class="row">
      <button id="save" type="button">Save now</button>
      <button id="submit" class="primary">Submit assessment</button>
      <p id="saveStatus" role="status" aria-live="polite"></p>
    </div>
  </form>
</section>
</main>
<script src="api.js"></script><script src="assigned.js"></script>
</body></html>
