name: Test Maths Trek integration
on:
  push:
    branches: [feature/maths-trek-safe-integration]
    paths: ['assessments/**', 'maths-trek/**', '.github/workflows/test-maths-trek.yml']
  pull_request:
    paths: ['assessments/**', 'maths-trek/**', '.github/workflows/test-maths-trek.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node maths-trek/tests/integration.mjs
