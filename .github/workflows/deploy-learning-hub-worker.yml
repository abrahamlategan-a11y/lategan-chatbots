name: Deploy Learning Hub Worker (manual, protected)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-WORKER to acknowledge this updates the live Worker including Pirate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learning-hub-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY-WORKER' }}
    runs-on: ubuntu-latest
    environment: learning-hub-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment prerequisites
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f cloudflare/worker.js || { echo "Missing verified complete Worker source. Refusing to deploy."; exit 1; }
          test -f cloudflare/wrangler.toml || { echo "Missing verified Wrangler configuration. Refusing to deploy."; exit 1; }
      - name: Deploy complete Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.toml
