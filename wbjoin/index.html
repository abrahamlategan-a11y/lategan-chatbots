<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Join Whiteboard · Learning Hub</title>
<style>
:root{--ink:#17352b;--muted:#6f7f77;--line:#d9e4de;--green:#176147;--deep:#104636;--bg:#f3f6f3;--panel:#fff;--sage:#e5f0e4;--shadow:0 14px 34px rgba(23,53,43,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.join{min-height:100%;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#e1eee5 0,transparent 34%),var(--bg)}
.card{width:min(520px,95vw);background:#fff;border:1px solid var(--line);border-radius:23px;padding:26px;box-shadow:var(--shadow)}.logo{width:48px;height:48px;border-radius:14px;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:950;margin-bottom:14px}.card h1{margin:0 0 6px;font-size:32px;letter-spacing:-.04em}.card p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:950;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px}.code{text-transform:uppercase;font-weight:950;letter-spacing:.15em}
.board-app{height:100%;display:none;flex-direction:column;background:#e9efeb}.board-app.on{display:flex}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}.name{font-weight:950}.pill{background:var(--sage);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.toolbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px}.toolset{display:flex;align-items:center;gap:5px;padding-right:8px;border-right:1px solid var(--line)}.tool{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px;font-weight:900}.tool.on{outline:2px solid var(--green);outline-offset:1px}.color{width:25px;height:25px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.color.on{box-shadow:0 0 0 3px #80a695}.frost{display:none;background:#dce8f4;border-bottom:1px solid #c8d9e8;color:#244a66;text-align:center;padding:7px 12px;font-size:12px;font-weight:850}.frost.on{display:block}.canvas-wrap{flex:1;min-height:0;padding:10px;position:relative}#boardCanvas{width:100%;height:100%;background:#fff;border-radius:12px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block}.corner{position:absolute;right:20px;bottom:17px;font-size:11px;font-weight:900;color:#809087;pointer-events:none}.sync{margin-left:auto;font-size:10px;color:var(--muted);font-weight:850}
</style>
</head>
<body>
<section class="join" id="joinView"><div class="card"><div class="logo">LH</div><h1>Join a whiteboard</h1><p>You do not need a Learning Hub account. Enter the session code from the teacher and your first name.</p><div class="field"><label>Session code</label><input class="code" id="code" maxlength="5" placeholder="ABCDE"></div><div class="field"><label>Your name</label><input id="name" maxlength="40" placeholder="e.g. Sam"></div><button class="btn primary" id="joinBtn" style="width:100%;margin-top:6px">Join whiteboard</button></div></section>
<section class="board-app" id="boardApp">
  <div class="top"><div><span class="name" id="displayName">Guest</span> <span class="pill" id="sessionPill">Guest</span></div><button class="btn primary" id="shareBtn">🙋 Ask to share</button></div>
  <div class="frost" id="frostNote">❄️ Your answer is hidden until the teacher reveals it.</div>
  <div class="toolbar">
    <div class="toolset"><button class="tool on" data-tool="pen">Pen</button><button class="tool" data-tool="eraser">Eraser</button></div>
    <div class="toolset"><button class="color on" data-color="#17352b" style="background:#17352b"></button><button class="color" data-color="#000000" style="background:#000"></button><button class="color" data-color="#245da8" style="background:#245da8"></button><button class="color" data-color="#b73d38" style="background:#b73d38"></button><button class="color" data-color="#754aa3" style="background:#754aa3"></button><button class="color" data-color="#c69824" style="background:#c69824"></button></div>
    <div class="toolset"><button class="tool" data-width="2">Thin</button><button class="tool on" data-width="4">Medium</button><button class="tool" data-width="8">Thick</button></div>
    <div class="toolset"><button class="tool" id="undoBtn">Undo</button><button class="tool" id="clearBtn">Clear</button></div>
    <span class="sync" id="syncState">Ready</span>
  </div>
  <div class="canvas-wrap"><canvas id="boardCanvas"></canvas><div class="corner" id="cornerName"></div></div>
</section>
<script>
const API="https://lategan-chatbot.abrahamlategan.workers.dev", $=id=>document.getElementById(id);
let token="",board={version:1,strokes:[]},stateTimer=null,syncTimer=null,syncInFlight=false,syncDirty=false;
function cloneBoard(b){return JSON.parse(JSON.stringify(b))}
function fitCanvas(canvas){const ctx=canvas.getContext("2d"),r=canvas.getBoundingClientRect(),dpr=Math.min(1.5,Math.max(1,window.devicePixelRatio||1));const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap="round";ctx.lineJoin="round";return{ctx,r}}
function redraw(){const {ctx,r}=fitCanvas($("boardCanvas"));ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);for(const s of board.strokes){const pts=s.points||[];if(!pts.length)continue;ctx.save();ctx.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over";ctx.strokeStyle=s.color||"#17352b";ctx.lineWidth=s.width||4;ctx.beginPath();ctx.moveTo(pts[0].x*r.width,pts[0].y*r.height);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x*r.width,pts[i].y*r.height);ctx.stroke();ctx.restore()}}
function attach(){const c=$("boardCanvas");let drawing=false,current=null,tool="pen",color="#17352b",width=4,rect=null;function pt(e){const r=rect||c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function start(e){e.preventDefault();drawing=true;rect=c.getBoundingClientRect();c.setPointerCapture?.(e.pointerId);const p=pt(e);current={tool,color,width:tool==="eraser"?38:width,points:[p]};board.strokes.push(current);redraw()}function move(e){if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=pt(ev),last=current.points[current.points.length-1];if(!last||Math.hypot(p.x-last.x,p.y-last.y)>.0003)current.points.push(p)}redraw()}function end(e){if(!drawing)return;e.preventDefault();drawing=false;rect=null;current=null;queueSync()}c.addEventListener("pointerdown",start,{passive:false});c.addEventListener("pointermove",move,{passive:false});c.addEventListener("pointerup",end,{passive:false});c.addEventListener("pointercancel",end,{passive:false});return{setTool:v=>tool=v,setColor:v=>color=v,setWidth:v=>width=Number(v)||4}}
const engine=attach();
async function post(p){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong.");return d}
$("joinBtn").onclick=async()=>{try{const d=await post({action:"guest_whiteboard_join",join_code:$("code").value,display_name:$("name").value});token=d.guest_token;board=d.participant.board;$("joinView").style.display="none";$("boardApp").classList.add("on");$("displayName").textContent=d.participant.display_name;$("cornerName").textContent=d.participant.display_name;$("sessionPill").textContent="Guest · "+d.session.join_code;$("frostNote").classList.toggle("on",d.session.frost_mode===1);setTimeout(redraw,50);stateTimer=setInterval(poll,1500)}catch(e){alert(e.message)}};
async function poll(){if(!token)return;try{const d=await post({action:"guest_whiteboard_state",guest_token:token});if(d.session.status!=="active"){alert("This whiteboard session has ended.");location.reload();return}$("frostNote").classList.toggle("on",d.session.frost_mode===1&&!d.participant.revealed);if(!d.participant.ask_share){$("shareBtn").disabled=false;$("shareBtn").textContent="🙋 Ask to share"}}catch(e){console.warn(e)}}
function queueSync(){syncDirty=true;clearTimeout(syncTimer);$("syncState").textContent="Writing…";syncTimer=setTimeout(flushSync,850)}
async function flushSync(){if(syncInFlight||!syncDirty||!token)return;syncInFlight=true;syncDirty=false;await new Promise(r=>setTimeout(r,30));const snapshot=cloneBoard(board);try{$("syncState").textContent="Syncing…";await post({action:"guest_whiteboard_update",guest_token:token,board:snapshot});$("syncState").textContent="Live"}catch(e){syncDirty=true;$("syncState").textContent="Retrying…";syncTimer=setTimeout(flushSync,1200)}finally{syncInFlight=false;if(syncDirty)syncTimer=setTimeout(flushSync,850)}}
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tool]").forEach(x=>x.classList.remove("on"));b.classList.add("on");engine.setTool(b.dataset.tool)});
document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-color]").forEach(x=>x.classList.remove("on"));b.classList.add("on");engine.setColor(b.dataset.color);engine.setTool("pen");document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on",x.dataset.tool==="pen"))});
document.querySelectorAll("[data-width]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-width]").forEach(x=>x.classList.remove("on"));b.classList.add("on");engine.setWidth(b.dataset.width)});
$("undoBtn").onclick=()=>{board.strokes.pop();redraw();queueSync()};$("clearBtn").onclick=()=>{if(confirm("Clear this whiteboard?")){board={version:1,strokes:[]};redraw();queueSync()}};
$("shareBtn").onclick=async()=>{try{$("shareBtn").disabled=true;$("shareBtn").textContent="Request sent ✓";await post({action:"guest_whiteboard_ask_share",guest_token:token})}catch(e){$("shareBtn").disabled=false;alert(e.message)}};
window.addEventListener("resize",redraw);
</script>
</body></html>
