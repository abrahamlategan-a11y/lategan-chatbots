<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Trek | Learning Hub</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20352d;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}header{background:#214c3c;color:white;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between}header a{color:#d8eee2}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:25px}h2{font-size:20px}.sub{color:#607267}.panel{background:white;border:1px solid #dbe5de;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #153d2910}button,select,input{font:inherit}button{background:#28664e;border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#e5eee8;color:#24513d}button.active{background:#123c2d}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:5px;font-weight:600}select{border:1px solid #cad8ce;border-radius:8px;padding:10px;background:white;min-width:150px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.question{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1ed;gap:8px}.question select{min-width:80px;padding:7px}.tag{background:#eaf2eb;border-radius:7px;padding:3px 8px;color:#315c45;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{font-size:28px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#fff3d8;color:#704d12;margin:10px 0}.success{background:#e3f4e8;color:#225a35}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{border:1px solid #dbe5de;border-radius:10px;padding:12px}.mini strong{display:block;font-size:23px}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:12px}}
[hidden]{display:none!important}@media print{header,.controls,.toolbar,#status,#marking,#groupPanel,#export,#printReport{display:none!important}#reports{display:block!important}.panel{box-shadow:none;break-inside:avoid}body{background:white}}
.testButtons{display:flex;gap:8px;flex-wrap:wrap}.partScore{font-size:23px;font-weight:750;margin:14px 0 0}.markButtons{display:flex;gap:4px}.markButtons button{min-width:36px;padding:6px}.question{padding:5px 0}dialog{width:min(650px,92vw);border:1px solid #cad8ce;border-radius:15px;max-height:85vh}dialog::backdrop{background:#123c2d88}#groupMembers{max-height:46vh;overflow:auto}
.reportGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.reportHero{margin-top:16px;padding:18px;border-radius:12px;background:#edf1ef}.reportHero strong{display:block;font-size:2rem}.reportGrid h3{margin-top:0}.metric{margin:12px 0}.metric label{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}.metric progress{width:100%;height:9px;accent-color:#60756d}.tableScroll{overflow:auto}.strandTable{width:100%;border-collapse:collapse;min-width:620px}.strandTable th,.strandTable td{text-align:left;padding:12px;border-bottom:1px solid #e2e8e4}.strandTable thead{background:#edf1ef}.strandTable tbody tr:nth-child(even){background:#f7f9f8}.strandTable td{font-variant-numeric:tabular-nums}.strandTable button{padding:5px 9px}@media(max-width:650px){.reportGrid{grid-template-columns:1fr}}@media print{.reportSwitch{display:none!important}}

/* Learning Hub approved playful pastel facelift: presentation only */
:root{font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;color:#111b4b;background:#fffefa}
body{background:radial-gradient(circle at 95% 2%,#e1faf0 0,transparent 27%),#fffefa;color:#111b4b}
header{background:linear-gradient(110deg,#9fead8,#d8c5f7);color:#111b4b;padding:25px 4vw;border-radius:0 0 28px 28px}
header h1{font-size:32px;letter-spacing:-.04em}header a{color:#182454;font-weight:800;background:#ffffffb9;border-radius:13px;padding:9px 12px;text-decoration:none}
main{max-width:1280px}.panel{border:1px solid #f0edf5;border-radius:24px;box-shadow:0 7px 22px #2432630a;padding:21px}
button{background:#5569cf;border-radius:13px;font-weight:800}button.secondary{background:#e9dafa;color:#26205c}button.active{background:#3bbf9e;color:#10254d}
select,input{border-radius:13px;border-color:#e0dff0}.tag{background:#e0f8ed;color:#194c49;border-radius:11px}
.mini{border-radius:17px;border-color:#e9e6f4;background:#f9f5ff}.mini:nth-child(even){background:#edfaf5}
.reportHero{background:#e3f7f0;border-radius:20px}.strandTable thead{background:#e8f5f2}

</style></head><body><header><div><h1>🧭 Maths Trek</h1><small>Learning Hub · Teacher assessments</small></div><nav class="toolbar"><a id="pageLink" href="?view=summary">Summary</a><a href="../teacher/">Teacher Hub</a></nav></header>
<main><div id="status" class="notice">Connecting to your Learning Hub…</div>
<div class="panel controls"><label>Class<select id="class"></select></label><button id="custom" class="secondary">Custom class</button><label hidden>Test<select id="test"><option value="1">Test 1</option><option value="2">Test 2</option><option value="3">Test 3</option><option value="4">Test 4</option></select></label></div><div class="panel toolbar" id="assessmentControls"><strong>Assess</strong><div class="testButtons" id="testButtons"></div></div><div class="panel controls"><label>Student<select id="student"></select></label><span id="progress" class="sub"></span><button id="saveTop" hidden>Submit and next</button></div>
<section id="marking" hidden><div class="grid" id="columns"></div><div class="panel toolbar"><button id="save">Submit and next</button><span id="saveState" role="status" class="sub"></span></div></section>
<dialog id="groupPanel"><h2>Custom class</h2><div class="controls"><label>Class name<input id="groupName" maxlength="100" placeholder="e.g. Braam Extension Class"></label><button id="createGroup">Save custom class</button><button id="closeGroup" class="secondary">Cancel</button></div><div id="groupMembers" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div><p id="groupError" role="status"></p></dialog>
<section id="reports" class="hidden"><div class="panel"><div class="toolbar reportSwitch" aria-label="Results view"><button id="studentView" class="active" aria-pressed="true">Student view</button><button id="classView" class="secondary" aria-pressed="false">Class view</button></div><h2 id="reportHeading">Student progress</h2><div class="controls"><label>Report test<select id="reportTest"><option value="">All completed tests</option><option value="1">Test 1</option><option value="2">Test 2</option><option value="3">Test 3</option><option value="4">Test 4</option></select></label><button id="printReport" class="secondary">Print / save PDF</button></div><div class="cards" id="reportCards"></div><div id="reportTotal"></div><div id="classReport" class="tableScroll" hidden></div><button id="export">Export class results (CSV)</button></div></section>
</main><script src="./reporting.js"></script><script>
const API="https://lategan-chatbot.abrahamlategan.workers.dev",code=localStorage.getItem("lategan_teacher_code")||"";
const el=id=>document.getElementById(id);let classes=[],students=[],results=[],marks=Array(40).fill(0),dirty=false,ready=false,metadata=[],groups=[],busy=false,selection={class:"",student:"",test:"1"};
async function post(data){const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,teacher_code:code})});const j=await response.json();if(!response.ok||j.error)throw Error(j.error||"Server error");return j}
function message(s,good=false){el("status").textContent=s;el("status").className="notice"+(good?" success":"")}
function options(id,rows,value,label){const node=el(id);node.replaceChildren();for(const row of rows){const o=document.createElement("option");o.value=String(row[value]);o.textContent=row[label];node.append(o)}}
function currentStudent(){return Number(el("student").value)}
function currentTest(){return Number(el("test").value)}
function existing(){return results.find(r=>Number(r.student_id)===currentStudent()&&Number(r.test||r.test_number)===currentTest())}
const summaryPage=new URLSearchParams(location.search).get("view")==="summary";
let selectedTest=summaryPage,schoolRoster=null,regularClasses=[];
const parts=[[0,24,1],[24,36,2],[36,40,3]];
const draftKey=()=>JSON.stringify(["maths-trek-draft",currentStudent(),currentTest()]);
function loadMarks(){
 selection={class:el("class").value,student:el("student").value,test:el("test").value};
 const saved=existing();
 marks=saved?.marks?.length===40?[...saved.marks]:Array(40).fill(0);
 dirty=false;
 if(!summaryPage&&currentStudent())try{const draft=JSON.parse(localStorage.getItem(draftKey()));if(Array.isArray(draft)&&draft.length===40){marks=draft;dirty=true}}catch{}
 render();if(summaryPage)renderReports();
}
function saveDraft(){
 dirty=true;
 try{localStorage.setItem(draftKey(),JSON.stringify(marks))}catch{}
 el("saveState").textContent="Draft · submit to finish";
}
function render(){
 const root=el("columns");root.replaceChildren();
 el("marking").hidden=summaryPage||!selectedTest||!currentStudent();
 const list=Array.from(el("student").options);
 el("progress").textContent=list.length?(el("student").selectedIndex+1)+" of "+list.length+(existing()?" · Completed":""):"";
 for(const button of el("testButtons").children){
  const active=selectedTest&&Number(button.dataset.test)===currentTest();
  button.classList.toggle("active",active);button.setAttribute("aria-pressed",active);
 }
 el("saveTop").hidden=el("marking").hidden;
 if(el("marking").hidden)return;
 parts.forEach(([from,to,max],part)=>{
  const panel=document.createElement("section");panel.className="panel";
  const title=document.createElement("h2");title.textContent="Part "+(part+1);
  const all=document.createElement("button");all.className="secondary";all.textContent="Mark all correct";
  const score=document.createElement("div");score.className="partScore";
  const update=()=>score.textContent=marks.slice(from,to).reduce((sum,n)=>sum+n,0)+" / "+((to-from)*max);
  all.onclick=()=>{marks.fill(max,from,to);saveDraft();render()};
  panel.append(title,all);
  for(let i=from;i<to;i++){
   const row=document.createElement("div");row.className="question";
   const label=document.createElement("span");label.textContent="Q"+(i+1);
   const controls=document.createElement("div");controls.className="markButtons";
   for(let n=0;n<=max;n++){
    const button=document.createElement("button");button.textContent=n;
    button.setAttribute("aria-label","Question "+(i+1)+", "+n+" marks");
    const select=()=>{for(const item of controls.children){const active=Number(item.textContent)===marks[i];item.className=active?"active":"secondary";item.setAttribute("aria-pressed",active)}};
    button.onclick=()=>{marks[i]=n;select();update();saveDraft()};controls.append(button);select();
   }
   row.append(label,controls);panel.append(row);
  }
  update();panel.append(score);root.append(panel);
 });
 el("saveTop").disabled=el("save").disabled=!ready;
 el("saveState").textContent=dirty?"Draft · submit to finish":existing()?"Completed":"";
}
async function loadStudents(){
 const value=el("class").value;
 if(value.startsWith("group:")){
  const group=groups.find(g=>"group:"+g.id===value);
  const ids=new Set((group?.ids||[]).map(Number));
  const roster=schoolRoster||await loadAccessibleRoster();
  students=roster.filter(s=>ids.has(Number(s.id)));
 }else if(schoolRoster){
  students=schoolRoster.filter(s=>value==="all"||String(s.class_id)===value);
 }else{
  const d=await post({action:"teacher_list_students",class_id:Number(value)});
  students=(d.students||[]).filter(s=>Number(s.active)!==0);
 }
 students.sort((a,b)=>a.display_name.localeCompare(b.display_name));
 options("student",students,"id","display_name");loadMarks();
}
async function loadAccessibleRoster(){
 const lists=await Promise.all(regularClasses.map(c=>post({action:"teacher_list_students",class_id:c.id})));
 return [...new Map(lists.flatMap(d=>d.students||[]).filter(s=>Number(s.active)!==0).map(s=>[s.id,s])).values()];
}
async function loadResults(){try{const d=await post({action:"maths_trek_list"});results=d.results||[];ready=true;message("Connected. Results are stored centrally.",true)}catch(e){ready=false;results=[];message("Maths Trek backend not activated yet: "+e.message+". Marking can be explored, but saving is disabled.");}loadMarks()}
function classOptions(preferred){
 options("class",[...classes,...groups.map(g=>({id:"group:"+g.id,name:g.name}))],"id","name");
 if(Array.from(el("class").options).some(o=>o.value===preferred))el("class").value=preferred;
}
async function init(){
 if(!code){message("Please sign in through Teacher Hub first.");return}
 try{
  const response=await fetch("./question-metadata.json",{cache:"no-store"});
  if(!response.ok)throw Error("Question metadata unavailable");
  metadata=await response.json();
  const d=await post({action:"teacher_list_classes"});regularClasses=d.classes||[];classes=[...regularClasses];
  try{
   const roster=await post({action:"maths_trek_roster"});
   if(Array.isArray(roster.students)){
    schoolRoster=roster.students;
    const ids=new Set(classes.map(c=>String(c.id)));
    for(const student of schoolRoster)if(!ids.has(String(student.class_id))){
     ids.add(String(student.class_id));classes.push({id:student.class_id,name:student.class_name||"Unassigned"});
    }
    classes.push({id:"all",name:"All students"});
   }
  }catch{}
  groups=(await post({action:"maths_trek_groups_list"})).groups||[];
  classOptions(new URLSearchParams(location.search).get("class"));
  await loadResults();await loadStudents();
  const params=new URLSearchParams(location.search);
  if(summaryPage&&students.some(s=>String(s.id)===params.get("student"))){el("student").value=params.get("student");loadMarks()}
 }catch(e){message("Could not load Maths Trek: "+e.message)}
}
async function save(){
 if(busy||!ready||!currentStudent())return;
 const studentId=currentStudent(),test=currentTest(),snapshot=[...marks],key=draftKey();
 const picker=el("student"),next=(picker.selectedIndex+1)%picker.options.length;
 busy=true;setDisabled(true);el("saveState").textContent="Saving…";
 try{
  const d=await post({action:"maths_trek_save",student_id:studentId,test_number:test,marks:snapshot});
  results=results.filter(r=>!(Number(r.student_id)===studentId&&Number(r.test||r.test_number)===test));
  results.push({student_id:studentId,test,marks:snapshot,total:d.total});
  try{localStorage.removeItem(key)}catch{}
  picker.selectedIndex=next;loadMarks();
  picker.closest(".panel").scrollIntoView({block:"start",behavior:"instant"});
 }catch(e){el("saveState").textContent="Save failed. Your draft is still here. "+e.message}
 finally{busy=false;setDisabled(false)}
}
let classReportMode=false;
const strandLabels=[["NA","Number & Algebra"],["MG","Measurement & Geometry"],["SP","Statistics & Probability"]];
function reportNode(tag,text,css){
 const node=document.createElement(tag);
 if(text!=null)node.textContent=text;
 if(css)node.className=css;
 return node;
}
function reportPercent(score,max){return max?Math.round(score/max*100)+"%":"—"}
function renderReports(){
 const testFilter=el("reportTest").value;
 const byStudent=new Map();
 for(const r of results){
  if(testFilter&&Number(r.test||r.test_number)!==Number(testFilter))continue;
  const id=Number(r.student_id);
  if(!byStudent.has(id))byStudent.set(id,[]);
  byStudent.get(id).push(r);
 }
 const root=el("reportCards"),box=el("reportTotal"),classBox=el("classReport");
 root.replaceChildren();box.replaceChildren();classBox.replaceChildren();
 root.hidden=box.hidden=classReportMode;classBox.hidden=!classReportMode;
 for(const [id,active] of [["classView",classReportMode],["studentView",!classReportMode]]){
  el(id).className=active?"active":"secondary";el(id).setAttribute("aria-pressed",active);
 }
 if(classReportMode){
  el("reportHeading").textContent=(el("class").selectedOptions[0]?.textContent||"Class")+" · strand overview";
  classBox.append(reportNode("p","A dash means there are no submitted marks for that strand in the selected tests.","sub"));
  const table=reportNode("table",null,"strandTable"),head=table.createTHead().insertRow();
  for(const label of ["Student",...strandLabels.map(([,label])=>label)]){
   const th=reportNode("th",label);th.scope="col";head.append(th);
  }
  const body=table.createTBody();
  for(const student of students){
   const row=body.insertRow(),cell=row.insertCell();
   const button=reportNode("button",student.display_name,"secondary");
   button.onclick=()=>{el("student").value=String(student.id);classReportMode=false;loadMarks()};
   cell.append(button);
   const d=mathsTrekSummary(byStudent.get(Number(student.id))||[],metadata);
   for(const [key] of strandLabels){
    const {score,max}=d.strands[key];row.insertCell().textContent=reportPercent(score,max);
   }
  }
  if(!students.length)classBox.append(reportNode("p","No students in this class."));
  else classBox.append(table);
  return;
 }
 const id=currentStudent(),rs=byStudent.get(id)||[];
 el("reportHeading").textContent=(students.find(s=>Number(s.id)===id)?.display_name||"Student")+" · progress";
 for(let test=1;test<=4;test++){
  const r=results.find(x=>Number(x.student_id)===id&&Number(x.test||x.test_number)===test);
  const card=reportNode("div",null,"mini");
  card.append(reportNode("div","Test "+test),reportNode("strong",r?mathsTrekSummary([r],metadata).total+" / 60":"Not marked"));
  root.append(card);
 }
 const d=mathsTrekSummary(rs,metadata);
 const hero=reportNode("div",null,"reportHero");
 hero.append(reportNode("span","Overall result"),reportNode("strong",d.available?reportPercent(d.total,d.available):"Not marked"),reportNode("span",d.available?d.total+" / "+d.available+" marks · "+rs.length+" submitted "+(rs.length===1?"test":"tests"):"No submitted marks for this selection.","sub"));
 const grid=reportNode("div",null,"reportGrid");
 function metricCard(title,entries){
  const card=reportNode("section",null,"mini");card.append(reportNode("h3",title));
  for(const [label,{score,max}] of entries){
   const metric=reportNode("div",null,"metric"),line=reportNode("label");
   line.append(reportNode("span",label),reportNode("span",max?score+" / "+max+" · "+reportPercent(score,max):"—"));
   metric.append(line);
   if(max){const bar=reportNode("progress");bar.max=max;bar.value=score;bar.setAttribute("aria-label",label);metric.append(bar)}
   card.append(metric);
  }
  return card;
 }
 grid.append(metricCard("Strands",strandLabels.map(([key,label])=>[label,d.strands[key]])),metricCard("Test parts",d.parts.map((part,i)=>["Part "+(i+1),part])));
 const notes=reportNode("div",null,"reportGrid");
 for(const [title,items] of [["Strengths",d.strengths],["Areas to consolidate",d.growth]]){
  const card=reportNode("section",null,"mini");card.append(reportNode("h3",title));
  if(items.length){const list=reportNode("ul");for(const x of items)list.append(reportNode("li",x.name+" ("+Math.round(x.pct*100)+"%)"));card.append(list)}
  else card.append(reportNode("p","Not enough evidence yet","sub"));
  notes.append(card);
 }
 box.append(hero,grid,notes);
}
el("studentView").onclick=()=>{classReportMode=false;renderReports()};
el("classView").onclick=()=>{classReportMode=true;renderReports()};
function exportCsv(){
 const group=groups.find(g=>"group:"+g.id===el("class").value);
 const eligible=students;
 const rows=[["Student","Class","Test","Part 1 /24","Part 2 /24","Part 3 /12","Total /60","Percentage","NA score","NA available","MG score","MG available","SP score","SP available","Strengths","Areas to consolidate"]];
 for(const s of eligible)for(let test=1;test<=4;test++){
  if(el("reportTest").value&&test!==Number(el("reportTest").value))continue;
  const r=results.find(x=>Number(x.student_id)===Number(s.id)&&Number(x.test||x.test_number)===test);
  if(!r){rows.push([s.display_name,s.class_name||"",test,...Array(13).fill("")]);continue}
  const d=mathsTrekSummary([r],metadata);rows.push([s.display_name,s.class_name||"",test,...d.parts.map(x=>x.score),d.total,Math.round(d.total/60*100),...Object.values(d.strands).flatMap(x=>[x.score,x.max]),d.strengths.map(x=>x.name).join("; "),d.growth.map(x=>x.name).join("; ")]);
 }
 const csv="\uFEFF"+rows.map(row=>row.map(mathsTrekCsvCell).join(",")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="maths-trek-"+(group?"group":"class")+"-results.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function setDisabled(disabled){
 document.querySelectorAll("button,select,input").forEach(n=>n.disabled=disabled);
 el("saveTop").disabled=el("save").disabled=disabled||!ready;
}
el("custom").onclick=async()=>{
 if(busy)return;
 try{
  const roster=schoolRoster||await loadAccessibleRoster();
  const box=el("groupMembers");box.replaceChildren();
  for(const student of roster){
   const label=document.createElement("label");
   const check=document.createElement("input");check.type="checkbox";check.value=student.id;
   label.append(check,document.createTextNode(" "+student.display_name+" · "+(student.class_name||"Unassigned")));
   box.append(label);
  }
  el("groupError").textContent="";el("groupPanel").showModal();
 }catch(e){message("Could not load students: "+e.message)}
};
el("closeGroup").onclick=()=>el("groupPanel").close();
el("createGroup").onclick=async()=>{
 if(busy)return;
 const name=el("groupName").value.trim();
 const ids=Array.from(el("groupMembers").querySelectorAll("input:checked"),x=>Number(x.value));
 if(!name||!ids.length){el("groupError").textContent="Enter a name and select students.";return}
 busy=true;setDisabled(true);
 try{
  const d=await post({action:"maths_trek_groups_save",name,student_ids:ids});
  groups.push({id:d.group_id,name,ids});classOptions("group:"+d.group_id);
  el("groupPanel").close();el("groupName").value="";await loadStudents();
 }catch(e){el("groupError").textContent=e.message}
 finally{busy=false;setDisabled(false)}
};
for(let test=1;test<=4;test++){
 const button=document.createElement("button");button.className="secondary";button.dataset.test=test;button.textContent="Test "+test;
 button.onclick=()=>{selectedTest=true;el("test").value=test;el("student").selectedIndex=0;loadMarks()};
 el("testButtons").append(button);
}
el("class").onchange=async()=>{
 if(busy)return;
 busy=true;setDisabled(true);
 try{await loadStudents()}catch(e){el("class").value=selection.class;message("Could not load class: "+e.message)}
 finally{busy=false;setDisabled(false)}
};
el("student").onchange=loadMarks;
el("saveTop").onclick=el("save").onclick=save;
el("export").onclick=exportCsv;el("reportTest").onchange=renderReports;el("printReport").onclick=()=>window.print();
el("pageLink").textContent=summaryPage?"Back to marking":"Summary";
el("pageLink").onclick=e=>{
 if(busy){e.preventDefault();return}
 const params=new URLSearchParams({class:el("class").value,student:el("student").value});
 if(!summaryPage)params.set("view","summary");
 el("pageLink").href="?"+params;
};
el("assessmentControls").hidden=summaryPage;
el("custom").hidden=summaryPage;
el("reports").classList.toggle("hidden",!summaryPage);
setDisabled(true);busy=true;init().finally(()=>{busy=false;setDisabled(false)});
</script></body></html>
