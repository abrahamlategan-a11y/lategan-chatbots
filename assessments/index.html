<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Trek | Learning Hub</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20352d;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}header{background:#214c3c;color:white;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between}header a{color:#d8eee2}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:25px}h2{font-size:20px}.sub{color:#607267}.panel{background:white;border:1px solid #dbe5de;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #153d2910}button,select,input{font:inherit}button{background:#28664e;border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#e5eee8;color:#24513d}button.active{background:#123c2d}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:5px;font-weight:600}select{border:1px solid #cad8ce;border-radius:8px;padding:10px;background:white;min-width:150px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.question{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1ed;gap:8px}.question select{min-width:80px;padding:7px}.tag{background:#eaf2eb;border-radius:7px;padding:3px 8px;color:#315c45;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.score{font-size:28px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#fff3d8;color:#704d12;margin:10px 0}.success{background:#e3f4e8;color:#225a35}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{border:1px solid #dbe5de;border-radius:10px;padding:12px}.mini strong{display:block;font-size:23px}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><header><div><h1>🧭 Maths Trek</h1><small>Learning Hub · Teacher assessments</small></div><a href="../teacher/">← Teacher Hub</a></header>
<main><div id="status" class="notice">Connecting to your Learning Hub…</div>
<div class="panel controls"><label>Class<select id="class"></select></label><label>Student<select id="student"></select></label><label>Test<select id="test"><option value="1">Test 1</option><option value="2">Test 2</option><option value="3">Test 3</option><option value="4">Test 4</option></select></label><button class="secondary" id="refresh">Refresh</button></div>
<div class="toolbar"><button id="markTab" class="active">Mark assessments</button><button id="reportTab" class="secondary">Results & reports</button></div>
<section id="marking"><div class="panel"><div class="toolbar" style="justify-content:space-between"><div><h2 id="heading">Marking</h2><span class="sub">40 questions · 60 marks · partial marks supported</span></div><div><span class="score" id="score">0 / 60</span></div></div></div><div class="grid" id="columns"></div><div class="panel toolbar"><button id="save">Save & next student</button><button class="secondary" id="saveOnly">Save marks</button><span id="saveState" class="sub"></span></div></section>
<section id="reports" class="hidden"><div class="panel"><h2>Student progress</h2><p class="sub">Results saved across four Maths Trek tests.</p><div class="cards" id="reportCards"></div><p id="reportTotal"></p><button id="export">Export class results (CSV)</button></div></section>
</main><script>
const API="https://lategan-chatbot.abrahamlategan.workers.dev",code=localStorage.getItem("lategan_teacher_code")||"";
const el=id=>document.getElementById(id);let classes=[],students=[],results=[],marks=Array(40).fill(0),dirty=false,ready=false;
async function post(data){const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,teacher_code:code})});const j=await response.json();if(!response.ok||j.error)throw Error(j.error||"Server error");return j}
function message(s,good=false){el("status").textContent=s;el("status").className="notice"+(good?" success":"")}
function options(id,rows,value,label){const node=el(id);node.replaceChildren();for(const row of rows){const o=document.createElement("option");o.value=String(row[value]);o.textContent=row[label];node.append(o)}}
function currentStudent(){return Number(el("student").value)}
function currentTest(){return Number(el("test").value)}
function existing(){return results.find(r=>Number(r.student_id)===currentStudent()&&Number(r.test||r.test_number)===currentTest())}
function loadMarks(){const r=existing();marks=Array.isArray(r?.marks)&&r.marks.length===40?r.marks.map(Number):Array(40).fill(0);dirty=false;render();renderReports()}
function render(){el("heading").textContent="Test "+currentTest()+" · "+(students.find(s=>Number(s.id)===currentStudent())?.display_name||"Choose a student");el("score").textContent=marks.reduce((a,b)=>a+b,0)+" / 60";const root=el("columns");root.replaceChildren();[[0,24,1],[24,36,2],[36,40,3]].forEach(([from,to,max])=>{const panel=document.createElement("div");panel.className="panel";const h=document.createElement("h2");h.textContent=max+"-mark questions";panel.append(h);const all=document.createElement("button");all.className="secondary";all.textContent="Mark all correct";all.onclick=()=>{for(let i=from;i<to;i++)marks[i]=max;dirty=true;render()};panel.append(all);for(let i=from;i<to;i++){const row=document.createElement("div");row.className="question";const label=document.createElement("span");label.textContent="Question "+(i+1);const select=document.createElement("select");for(let n=0;n<=max;n++){const opt=document.createElement("option");opt.value=n;opt.textContent=n+" / "+max;select.append(opt)}select.value=marks[i];select.onchange=()=>{marks[i]=Number(select.value);dirty=true;el("score").textContent=marks.reduce((a,b)=>a+b,0)+" / 60";el("saveState").textContent="Unsaved changes"};row.append(label,select);panel.append(row)}root.append(panel)});el("saveState").textContent=dirty?"Unsaved changes":existing()?"Previously saved":"Not yet marked"}
async function loadStudents(){const id=Number(el("class").value);const d=await post({action:"teacher_list_students",class_id:id});students=(d.students||[]).filter(s=>Number(s.active)!==0);options("student",students,"id","display_name");loadMarks()}
async function loadResults(){try{const d=await post({action:"maths_trek_list"});results=d.results||[];ready=true;message("Connected. Results are stored centrally.",true)}catch(e){ready=false;results=[];message("Maths Trek backend not activated yet: "+e.message+". Marking can be explored, but saving is disabled.");}loadMarks()}
async function init(){if(!code){message("Please sign in through Teacher Hub first.");return}try{const d=await post({action:"teacher_list_classes"});classes=d.classes||[];options("class",classes,"id","name");if(!classes.length){message("No classes available.");return}await loadStudents();await loadResults()}catch(e){message("Could not load students: "+e.message)}}
async function save(next){if(!ready){message("Saving is unavailable until the Maths Trek backend and database are deployed.");return}if(!currentStudent())return;const studentId=currentStudent(),test=currentTest();el("save").disabled=el("saveOnly").disabled=true;try{const d=await post({action:"maths_trek_save",student_id:studentId,test_number:test,marks});results=results.filter(r=>!(Number(r.student_id)===studentId&&Number(r.test||r.test_number)===test));results.push({student_id:studentId,test,marks:[...marks],total:d.total});dirty=false;message("Saved "+d.total+" / 60 for "+students.find(s=>Number(s.id)===studentId)?.display_name,true);if(next){const remaining=students.find(s=>Number(s.id)!==studentId&&!results.some(r=>Number(r.student_id)===Number(s.id)&&Number(r.test||r.test_number)===test));if(remaining)el("student").value=String(remaining.id)}loadMarks()}catch(e){message("Save failed: "+e.message)}finally{el("save").disabled=el("saveOnly").disabled=false}}
function renderReports(){const id=currentStudent();const rs=results.filter(r=>Number(r.student_id)===id);const root=el("reportCards");root.replaceChildren();let sum=0,count=0;for(let test=1;test<=4;test++){const r=rs.find(x=>Number(x.test||x.test_number)===test);const card=document.createElement("div");card.className="mini";const h=document.createElement("div");h.textContent="Test "+test;const v=document.createElement("strong");v.textContent=r?Number(r.total??r.total_score)+" / 60":"Not marked";card.append(h,v);root.append(card);if(r){sum+=Number(r.total??r.total_score);count++}}el("reportTotal").textContent=count?("Running total: "+sum+" / "+(count*60)+" ("+Math.round(sum/(count*60)*100)+"%)"):"No completed tests yet."}
function exportCsv(){const header=["Student","Class","Test 1","Test 2","Test 3","Test 4","Total","Available"];const rows=[header];for(const s of students){const r=results.filter(x=>Number(x.student_id)===Number(s.id));const scores=[1,2,3,4].map(n=>{const item=r.find(x=>Number(x.test||x.test_number)===n);return item?Number(item.total??item.total_score):""});rows.push([s.display_name,s.class_name||"",...scores,scores.reduce((a,b)=>a+(Number(b)||0),0),scores.filter(x=>x!=="").length*60])}const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="maths-trek-class-"+el("class").selectedOptions[0]?.textContent+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el("class").onchange=async()=>{if(dirty&&!confirm("Discard unsaved marks?"))return;await loadStudents()};el("student").onchange=()=>{if(dirty&&!confirm("Discard unsaved marks?"))return;loadMarks()};el("test").onchange=()=>{if(dirty&&!confirm("Discard unsaved marks?"))return;loadMarks()};el("refresh").onclick=loadResults;el("save").onclick=()=>save(true);el("saveOnly").onclick=()=>save(false);el("export").onclick=exportCsv;
el("markTab").onclick=()=>{el("marking").classList.remove("hidden");el("reports").classList.add("hidden");el("markTab").className="active";el("reportTab").className="secondary"};
el("reportTab").onclick=()=>{renderReports();el("marking").classList.add("hidden");el("reports").classList.remove("hidden");el("markTab").className="secondary";el("reportTab").className="active"};
init();
</script></body></html>
