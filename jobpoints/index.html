<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Points · Learning Hub</title>
<style>
:root{--bg:#f3f6f3;--panel:#fff;--ink:#17352b;--muted:#718078;--line:#d9e4de;--green:#176147;--deep:#104636;--sage:#e5f0e4;--shadow:0 14px 34px rgba(23,53,43,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,input{font:inherit}.shell{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top a{text-decoration:none;color:var(--ink);font-size:12px;font-weight:900}
.hero{margin-top:18px;background:linear-gradient(140deg,#155b43,#0e4434);color:#fff;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.hero h1{margin:0 0 5px;font-size:34px}.hero p{margin:0;color:#cfddd6;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}.notice{text-align:center;padding:28px}.notice h2{margin:0 0 6px}.notice p{color:var(--muted);font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.group{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafcfb}.group h3{margin:0 0 8px}.score{display:flex;gap:8px;align-items:center}.score input{width:90px;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:950;font-size:18px}.total{font-size:11px;color:var(--muted);margin-top:8px}.total strong{color:var(--ink)}
.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.savebar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:13px}.saved{font-size:11px;color:var(--muted)}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<div class="top"><strong>LH · Group Points</strong><a href="../student/">⌂ Student Hub</a></div>
<div class="hero"><h1>Group Points</h1><p>Today's Daily Helper can enter each job group's score out of 10.</p></div>
<div class="card" id="content"><div class="notice">Loading…</div></div>
</div>
<script>
const API="https://lategan-chatbot.abrahamlategan.workers.dev", code=localStorage.getItem("lategan_student_code")||"", $=id=>document.getElementById(id);
async function post(p){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong.");return d}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
let state=null;
async function load(){
  if(!code){location.href="../student/";return}
  try{state=await post({action:"student_job_points_state",student_code:code});render()}catch(e){$("content").innerHTML=`<div class="notice"><h2>Group Points unavailable</h2><p>${esc(e.message)}</p></div>`}
}
function render(){
  if(!state.enabled){$("content").innerHTML='<div class="notice"><h2>Group Points is turned off</h2><p>Your teacher has disabled this feature for now.</p></div>';return}
  if(!state.is_helper){$("content").innerHTML='<div class="notice"><h2>Daily Helper only</h2><p>Only today’s Daily Helper can enter the group points. If that’s not you today, there’s nothing you need to do here.</p></div>';return}
  const today=new Map((state.today||[]).map(x=>[String(x.group_id),Number(x.score)]));
  const totals=new Map((state.totals||[]).map(x=>[String(x.group_id),Number(x.total)||0]));
  $("content").innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:12px">You are today’s Daily Helper. Enter each group’s score, then save.</div><div class="grid">${(state.groups||[]).map(g=>`<div class="group"><h3>${esc(g.name)}</h3><div class="score"><input class="scoreInput" data-id="${esc(g.id)}" type="number" min="0" max="10" step="0.1" value="${today.has(String(g.id))?today.get(String(g.id)):""}"><span>/ 10</span></div><div class="total">Running total: <strong>${(totals.get(String(g.id))||0).toFixed(1)}</strong></div></div>`).join("")}</div><div class="savebar"><span class="saved" id="saved"></span><button class="btn primary" id="save">Save today’s points</button></div>`;
  $("save").onclick=save;
}
async function save(){
  const scores=[...document.querySelectorAll(".scoreInput")].map(i=>({group_id:i.dataset.id,score:i.value})).filter(x=>x.score!=="");
  for(const x of scores){const n=Number(x.score);if(!Number.isFinite(n)||n<0||n>10||Math.round(n*10)!==n*10){alert("Use a score from 0 to 10, with at most one decimal place.");return}x.score=n}
  try{await post({action:"student_job_points_save",student_code:code,scores});$("saved").textContent="Saved ✓";await load()}catch(e){alert(e.message)}
}
load();
</script></body></html>
